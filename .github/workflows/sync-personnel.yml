name: Sync Personnel from M365

on:
  schedule:
    # Run daily at 7 AM UTC (11 PM PST / 12 AM PDT)
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      force_refresh:
        description: 'Force refresh all photos (ignore hash comparison)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  id-token: write
  contents: write

jobs:
  sync-personnel:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: 7d94bc11-9bdf-445b-96c8-fca2560cd441
          tenant-id: 4122848f-c317-4267-9c07-7c504150d1bd
          allow-no-subscriptions: true

      - name: Get secrets from Key Vault
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            # MS Graph secrets
            MS_GRAPH_TENANT_ID=$(az keyvault secret show --vault-name gh-website-utilities --name MS-GRAPH-TENANT-ID --query value -o tsv)
            echo "::add-mask::$MS_GRAPH_TENANT_ID"
            echo "MS_GRAPH_TENANT_ID=$MS_GRAPH_TENANT_ID" >> $GITHUB_ENV

            MS_GRAPH_CLIENT_ID=$(az keyvault secret show --vault-name gh-website-utilities --name MS-GRAPH-CLIENT-ID --query value -o tsv)
            echo "::add-mask::$MS_GRAPH_CLIENT_ID"
            echo "MS_GRAPH_CLIENT_ID=$MS_GRAPH_CLIENT_ID" >> $GITHUB_ENV

            MS_GRAPH_CLIENT_SECRET=$(az keyvault secret show --vault-name gh-website-utilities --name MS-GRAPH-CLIENT-SECRET --query value -o tsv)
            echo "::add-mask::$MS_GRAPH_CLIENT_SECRET"
            echo "MS_GRAPH_CLIENT_SECRET=$MS_GRAPH_CLIENT_SECRET" >> $GITHUB_ENV

            # Cloudinary secrets
            CLOUDINARY_API_KEY=$(az keyvault secret show --vault-name gh-website-utilities --name CLOUDINARY-API-KEY --query value -o tsv)
            echo "::add-mask::$CLOUDINARY_API_KEY"
            echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" >> $GITHUB_ENV

            CLOUDINARY_API_SECRET=$(az keyvault secret show --vault-name gh-website-utilities --name CLOUDINARY-API-SECRET --query value -o tsv)
            echo "::add-mask::$CLOUDINARY_API_SECRET"
            echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" >> $GITHUB_ENV

            # GitHub App secrets (for pushing changes)
            GH_APP_ID=$(az keyvault secret show --vault-name gh-website-utilities --name GITHUB-APP-ID --query value -o tsv)
            echo "::add-mask::$GH_APP_ID"
            echo "GH_APP_ID=$GH_APP_ID" >> $GITHUB_ENV

            # Private key is stored base64-encoded in Key Vault
            GH_APP_PRIVATE_KEY_B64=$(az keyvault secret show --vault-name gh-website-utilities --name GITHUB-APP-PRIVATE-KEY --query value -o tsv)
            GH_APP_PRIVATE_KEY=$(echo "$GH_APP_PRIVATE_KEY_B64" | base64 -d)
            echo "::add-mask::$GH_APP_PRIVATE_KEY"
            echo "GH_APP_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
            echo "$GH_APP_PRIVATE_KEY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$MS_GRAPH_TENANT_ID" ] && missing="$missing MS-GRAPH-TENANT-ID"
          [ -z "$MS_GRAPH_CLIENT_ID" ] && missing="$missing MS-GRAPH-CLIENT-ID"
          [ -z "$MS_GRAPH_CLIENT_SECRET" ] && missing="$missing MS-GRAPH-CLIENT-SECRET"
          [ -z "$CLOUDINARY_API_KEY" ] && missing="$missing CLOUDINARY-API-KEY"
          [ -z "$CLOUDINARY_API_SECRET" ] && missing="$missing CLOUDINARY-API-SECRET"
          [ -z "$GH_APP_ID" ] && missing="$missing GITHUB-APP-ID"
          [ -z "$GH_APP_PRIVATE_KEY" ] && missing="$missing GITHUB-APP-PRIVATE-KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secrets in Key Vault:$missing"
            exit 1
          fi
          echo "All required secrets are present"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync personnel from Microsoft 365
        run: |
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            node scripts/sync-personnel.mjs --force-refresh
          else
            node scripts/sync-personnel.mjs
          fi

      - name: Check for changes
        id: changes
        run: |
          git add src/_data/personnel.json src/assets/media/personnel_imgs/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Show what changed
            echo "## Changed files:" >> $GITHUB_STEP_SUMMARY
            git diff --cached --name-only >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "sjifire-bot[bot]"
          git config user.email "${{ env.GH_APP_ID }}+sjifire-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git commit -m "chore: sync personnel data from Microsoft 365

          Auto-generated daily update of personnel information.
          Photos updated only when visually different (perceptual hash)."
          git push
