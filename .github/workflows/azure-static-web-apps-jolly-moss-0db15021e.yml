name: Azure Static Web Apps CI/CD

on:
  # Manual trigger for ad-hoc deployments
  workflow_dispatch:
  # Main branch: only deploy after CI passes
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  # PRs: deploy previews directly (original behavior)
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    # For workflow_dispatch: always run (manual trigger)
    # For workflow_run (main): only if CI succeeded
    # For pull_request: always run (except on close)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: 7d94bc11-9bdf-445b-96c8-fca2560cd441
          tenant-id: 4122848f-c317-4267-9c07-7c504150d1bd
          allow-no-subscriptions: true

      - name: Get secrets from Key Vault
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            COSMOS_DB_CONNECTION_STRING=$(az keyvault secret show --vault-name gh-website-utilities --name COSMOS-DB-CONNECTION-STRING --query value -o tsv)
            echo "::add-mask::$COSMOS_DB_CONNECTION_STRING"
            echo "COSMOS_DB_CONNECTION_STRING=$COSMOS_DB_CONNECTION_STRING" >> $GITHUB_ENV

            COSMOS_DB_NAME=$(az keyvault secret show --vault-name gh-website-utilities --name COSMOS-DB-NAME --query value -o tsv)
            echo "::add-mask::$COSMOS_DB_NAME"
            echo "COSMOS_DB_NAME=$COSMOS_DB_NAME" >> $GITHUB_ENV

            AZURE_STATIC_WEB_APPS_API_TOKEN=$(az keyvault secret show --vault-name gh-website-utilities --name AZURE-STATIC-WEB-APPS-API-TOKEN --query value -o tsv)
            echo "::add-mask::$AZURE_STATIC_WEB_APPS_API_TOKEN"
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$AZURE_STATIC_WEB_APPS_API_TOKEN" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set Cloudinary fetch URL for staging
        if: github.event_name == 'pull_request'
        run: echo "CLOUDINARY_FETCH_URL=https://jolly-moss-0db15021e-${{ github.event.pull_request.number }}.westus2.1.azurestaticapps.net" >> $GITHUB_ENV

      - name: Build TinaCMS and index schema
        run: npx tinacms build --skip-cloud-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Build 11ty site
        run: npm run build

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Deploy to Azure
        id: builddeploy
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "_site"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          TINA_PUBLIC_IS_LOCAL: "false"

      - name: Wait before retry
        if: steps.builddeploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Azure (retry)
        id: builddeploy_retry
        if: steps.builddeploy.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "_site"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          TINA_PUBLIC_IS_LOCAL: "false"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: 7d94bc11-9bdf-445b-96c8-fca2560cd441
          tenant-id: 4122848f-c317-4267-9c07-7c504150d1bd
          allow-no-subscriptions: true

      - name: Get secrets from Key Vault
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            AZURE_STATIC_WEB_APPS_API_TOKEN=$(az keyvault secret show --vault-name gh-website-utilities --name AZURE-STATIC-WEB-APPS-API-TOKEN --query value -o tsv)
            echo "::add-mask::$AZURE_STATIC_WEB_APPS_API_TOKEN"
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$AZURE_STATIC_WEB_APPS_API_TOKEN" >> $GITHUB_ENV

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}
