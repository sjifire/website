name: Cleanup Cloudinary Assets

on:
  schedule:
    # Run weekly on Sundays at 5 AM UTC (9 PM PST / 10 PM PDT Saturday)
    - cron: '0 5 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        description: 'Dry run (show what would be deleted without deleting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_age_days:
        description: 'Delete resources not accessed in N days'
        required: false
        default: '30'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: 7d94bc11-9bdf-445b-96c8-fca2560cd441
          tenant-id: 4122848f-c317-4267-9c07-7c504150d1bd
          allow-no-subscriptions: true

      - name: Get secrets from Key Vault
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "CLOUDINARY_API_KEY=$(az keyvault secret show --vault-name gh-website-utilities --name CLOUDINARY-API-KEY --query value -o tsv)" >> $GITHUB_ENV
            echo "CLOUDINARY_API_SECRET=$(az keyvault secret show --vault-name gh-website-utilities --name CLOUDINARY-API-SECRET --query value -o tsv)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cloudinary cleanup
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_age_days }}" ] && [ "${{ inputs.max_age_days }}" != "30" ]; then
            ARGS="$ARGS --days=${{ inputs.max_age_days }}"
          fi
          node scripts/cleanup-cloudinary.mjs $ARGS

      - name: Summary
        run: echo "Cloudinary cleanup completed. Check the logs above for details."
