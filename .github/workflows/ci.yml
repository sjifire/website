name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # api/ ships to Azure standalone: Oryx installs it from api/'s own lockfile
      # with no repo root in scope. Importing the entry point registers every
      # function, so an unresolvable import in any of them fails here instead of
      # silently taking down the whole Functions app after deploy -- which is how
      # /admin started returning 403 once uuid stopped being hoisted into api/.
      #
      # This must run OUTSIDE the repo: the root node_modules is a parent
      # directory of api/, so Node would resolve a package missing from api/'s
      # own tree from the root instead and mask exactly the break we are hunting.
      # Deliberately uncached -- a warm cache would hide the lockfile drift that
      # `npm ci` is here to catch.
      - name: Verify api/ installs and loads standalone
        run: |
          CHECK_DIR="${RUNNER_TEMP:-/tmp}/api-deploy-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          cp -R api/. "$CHECK_DIR"/
          rm -rf "$CHECK_DIR/node_modules"
          npm ci --prefix "$CHECK_DIR"
          node --input-type=module -e "
            await import('$CHECK_DIR/src/functions/index.js');
            console.log('api/ entry point loaded; all function modules resolve');
          "

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Stylelint
        run: npm run lint:css

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build site
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests (skip admin tests - requires TinaCMS build)
        run: npx playwright test --config=tests/playwright.config.js tests/smoke.spec.js tests/carousel.spec.js tests/governance.spec.js

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
